name: Generate GitHub Streak Card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nahilist
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from datetime import date, timedelta

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          calendar = (
              result["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda x: x["date"])

          # ---------------------------
          # LONGEST STREAK
          # ---------------------------

          longest = 0
          temp = 0

          longest_start = None
          longest_end = None
          temp_start = None

          for d in days:

              if d["count"] > 0:

                  if temp == 0:
                      temp_start = d["date"]

                  temp += 1

                  if temp > longest:
                      longest = temp
                      longest_start = temp_start
                      longest_end = d["date"]

              else:
                  temp = 0
                  temp_start = None

          # ---------------------------
          # CURRENT STREAK
          # ---------------------------

          current = 0
          current_start = None
          current_end = None

          active_days = [
              d for d in days
              if d["date"] <= date.today().isoformat()
          ]

          # GitHub-style behavior:
          # allow today to be empty while keeping yesterday's streak.
          if active_days:

              i = len(active_days) - 1

              if active_days[i]["count"] == 0:
                  i -= 1

              if i >= 0 and active_days[i]["count"] > 0:

                  current_end = active_days[i]["date"]

                  while i >= 0 and active_days[i]["count"] > 0:
                      current += 1
                      current_start = active_days[i]["date"]
                      i -= 1

          def pretty(d):
              if not d:
                  return "No active streak"

              dt = date.fromisoformat(d)

              return dt.strftime("%b %d, %Y").replace(" 0", " ")

          current_dates = (
              f"{pretty(current_start)} - {pretty(current_end)}"
              if current_start
              else "No active streak"
          )

          longest_dates = (
              f"{pretty(longest_start)} - {pretty(longest_end)}"
              if longest_start
              else "No streak"
          )

          # ---------------------------
          # SVG CARD
          # ---------------------------

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="760"
          height="210"
          viewBox="0 0 760 210">

          <rect
          width="760"
          height="210"
          rx="12"
          fill="#0d1117"/>

          <line
          x1="253"
          y1="35"
          x2="253"
          y2="175"
          stroke="#30363d"/>

          <line
          x1="506"
          y1="35"
          x2="506"
          y2="175"
          stroke="#30363d"/>

          <!-- TOTAL -->

          <text
          x="126"
          y="80"
          text-anchor="middle"
          fill="#f78166"
          font-family="Arial"
          font-size="34"
          font-weight="700">
          {total}
          </text>

          <text
          x="126"
          y="110"
          text-anchor="middle"
          fill="#ffffff"
          font-family="Arial"
          font-size="16"
          font-weight="600">
          Total Contributions
          </text>

          <text
          x="126"
          y="138"
          text-anchor="middle"
          fill="#8b949e"
          font-family="Arial"
          font-size="12">
          Last 12 months
          </text>

          <!-- CURRENT -->

          <text
          x="380"
          y="80"
          text-anchor="middle"
          fill="#f78166"
          font-family="Arial"
          font-size="34"
          font-weight="700">
          {current}
          </text>

          <text
          x="380"
          y="110"
          text-anchor="middle"
          fill="#ffffff"
          font-family="Arial"
          font-size="16"
          font-weight="600">
          Current Streak
          </text>

          <text
          x="380"
          y="138"
          text-anchor="middle"
          fill="#8b949e"
          font-family="Arial"
          font-size="11">
          {current_dates}
          </text>

          <!-- LONGEST -->

          <text
          x="633"
          y="80"
          text-anchor="middle"
          fill="#f78166"
          font-family="Arial"
          font-size="34"
          font-weight="700">
          {longest}
          </text>

          <text
          x="633"
          y="110"
          text-anchor="middle"
          fill="#ffffff"
          font-family="Arial"
          font-size="16"
          font-weight="600">
          Longest Streak
          </text>

          <text
          x="633"
          y="138"
          text-anchor="middle"
          fill="#8b949e"
          font-family="Arial"
          font-size="11">
          {longest_dates}
          </text>

          </svg>'''

          os.makedirs("generated", exist_ok=True)

          with open(
              "generated/github-streak.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Total Contributions:", total)
          print("Current Streak:", current)
          print("Longest Streak:", longest)

          PY

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/github-streak.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update GitHub streak card"
            git push
          fi
